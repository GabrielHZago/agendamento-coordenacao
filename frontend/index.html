<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda da Coordenação</title>
<meta name="description" content="Agendamento de atendimentos com a coordenação de curso">
<meta name="theme-color" content="#143a6b">
<link rel="stylesheet" href="/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Barra de acessibilidade -->
<div class="barra-acess small">
  <div class="container d-flex flex-wrap align-items-center gap-3 py-1">
    <a href="#conteudo" class="link-acess">Ir para o conteúdo</a>
    <a href="#admin" class="link-acess" id="atalho-admin" hidden>Administração</a>
    <div class="ms-auto d-flex flex-wrap align-items-center gap-3">
      <span class="d-none d-sm-inline text-body-secondary">Acessibilidade:</span>
      <span role="group" aria-label="Tamanho da fonte" class="d-inline-flex gap-1">
        <button type="button" class="btn-acess" data-fonte="14" aria-label="Diminuir fonte">A−</button>
        <button type="button" class="btn-acess" data-fonte="16" aria-label="Fonte padrão">A</button>
        <button type="button" class="btn-acess" data-fonte="19" aria-label="Aumentar fonte">A+</button>
      </span>
      <button type="button" class="btn-acess" id="btn-tema">Tema claro</button>
      <button type="button" class="btn-acess" id="btn-ouvir" aria-pressed="false">Ouvir página</button>
    </div>
  </div>
</div>

<div id="faixa-demo" class="faixa-demo small py-1" hidden>
  <div class="container">Ambiente de demonstração: os dados são fictícios e nada é gravado.</div>
</div>

<!-- Cabeçalho -->
<header class="cabecalho">
  <div class="container d-flex align-items-center gap-3 py-3">
    <a class="marca" href="#inicio">
      <span class="marca-nome">Agenda da Coordenação</span>
      <span class="marca-inst">Faculdade Anhanguera de Osasco</span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-3" id="usuario" hidden>
      <div class="text-end lh-sm d-none d-sm-block"><div class="fw-semibold" id="usuario-nome"></div><div class="small opacity-75" id="usuario-perfil"></div></div>
      <button type="button" class="btn btn-sm btn-outline-light" id="btn-sair">Sair</button>
    </div>
  </div>
</header>

<!-- Menu do perfil -->
<nav class="menu-principal border-bottom" aria-label="Menu principal" id="nav" hidden>
  <div class="container">
    <ul class="nav nav-underline flex-nowrap overflow-auto" id="menu"></ul>
  </div>
</nav>

<main id="conteudo" class="container py-4 flex-grow-1" tabindex="-1"></main>

<footer class="rodape border-top small">
  <div class="container d-flex flex-wrap justify-content-between gap-2 py-3">
    <span>Coordenação de curso · Faculdade Anhanguera de Osasco</span>
    <span>Agenda da Coordenação 1.0 · Projeto acadêmico</span>
  </div>
</footer>

<!-- Modal único reaproveitado por todos os diálogos -->
<div class="modal fade" id="modal" tabindex="-1" aria-labelledby="modal-titulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content"></div></div>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

<script src="/vendor/bootstrap.bundle.min.js" defer></script>
<script src="/vendor/imask.min.js" defer></script>
<script src="/js/util.js" defer></script>
<script src="/js/demo.js" defer></script>
<script src="/js/app.js" defer></script>
</body>
</html>
